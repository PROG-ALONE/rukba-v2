<style>
/* التخطيط: شريط علوي ثابت + تبويبات، ومحتوى بعمود واحد على الموبايل وشبكة على الآيباد */
:root {
  --bg: #eef3f2; --surface: #ffffff; --surface-2: #f4f8f7; --ink: #11282a; --ink-2: #47605f; --muted: #7c918f; --line: #d6e1df;
  --accent: #0d6d6a; --accent-ink: #ffffff; --accent-soft: #d6ecea;
  --path: #c27b14; --path-soft: #f7ead2;
  --ok: #1f8a4c; --ok-soft: #dbf1e3; --warn: #b77700; --warn-soft: #faefd3; --bad: #c83a3a; --bad-soft: #f9dfdf;
  --bone: #e9dcc0; --bone-line: #a8936a; --muscle: #d77a6f; --muscle-line: #a84b42; --tendon: #f3ecd9; --tendon-line: #b49a5d; --nerve: #e3b729; --skin: #f1d9c7;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --f-display: 'Noto Kufi Arabic', 'Geeza Pro', Tahoma, sans-serif;
  --f-body: 'IBM Plex Sans Arabic', -apple-system, 'SF Arabic', 'Geeza Pro', Tahoma, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1718; --surface: #142224; --surface-2: #1a2c2e; --ink: #e5efee; --ink-2: #a6bcba; --muted: #7d9593; --line: #29403f;
  --accent: #3fb6b0; --accent-ink: #062020; --accent-soft: #173d3c; --path: #e3a23c; --path-soft: #3a2c13;
  --ok: #4cc27f; --ok-soft: #173a27; --warn: #e0a42c; --warn-soft: #3b2f12; --bad: #ec6b6b; --bad-soft: #3d1f1f;
  --bone: #5c5240; --bone-line: #c2ad80; --muscle: #8f4a43; --muscle-line: #e0857a; --tendon: #6c6247; --tendon-line: #d9c18a; --nerve: #f0c93f; --skin: #4a3a31;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1718; --surface: #142224; --surface-2: #1a2c2e; --ink: #e5efee; --ink-2: #a6bcba; --muted: #7d9593; --line: #29403f;
  --accent: #3fb6b0; --accent-ink: #062020; --accent-soft: #173d3c; --path: #e3a23c; --path-soft: #3a2c13;
  --ok: #4cc27f; --ok-soft: #173a27; --warn: #e0a42c; --warn-soft: #3b2f12; --bad: #ec6b6b; --bad-soft: #3d1f1f;
  --bone: #5c5240; --bone-line: #c2ad80; --muscle: #8f4a43; --muscle-line: #e0857a; --tendon: #6c6247; --tendon-line: #d9c18a; --nerve: #f0c93f; --skin: #4a3a31;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.65; margin: 0; display: flex; flex-direction: column; overflow: hidden; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body { direction: rtl; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--series-1); outline-offset: 2px; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.35; text-wrap: balance; margin: 0; }

/* ---------- الهيكل ---------- */
html, body { height: 100%; overscroll-behavior: none; }
.top { position: relative; z-index: 50; flex: 0 0 auto; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 100%; margin: 0 auto; padding: max(env(safe-area-inset-top, 0px), 8px) 16px 0; }
.brandrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font-family: var(--f-display); font-size: 22px; font-weight: 800; }
.brand small { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.grow { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); } .badge.warn { background: var(--warn-soft); color: var(--warn); } .badge.bad { background: var(--bad-soft); color: var(--bad); } .badge.acc { background: var(--accent-soft); color: var(--accent); } .badge.path { background: var(--path-soft); color: var(--path); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 4px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: transparent; padding: 8px 16px; border-radius: 12px; white-space: nowrap; cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13px; transition: background .2s, color .2s; }
.tabs button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.tabs button:active { transform: scale(0.98); }
main { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; padding-top: 0; }
.view-port { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.view-content { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px env(safe-area-inset-bottom, 80px); }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; padding-top: 8px; }
.head h1 { font-size: clamp(22px, 3vw, 30px); }
.head p { margin: 4px 0 0; color: var(--ink-2); }

.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 960px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .g2, .g3 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 17px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- القائمة العائمة (نافذة في وسط الشاشة) ---------- */
.sheet-scrim { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.5); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet-scrim.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; top: 50%; left: 50%; z-index: 91; width: min(560px, calc(100vw - 28px)); max-height: min(80vh, 720px); background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 24px 70px rgba(0,0,0,.45); transform: translate(-50%, -50%) scale(.93); opacity: 0; transition: transform .3s cubic-bezier(.3,1.15,.5,1), opacity .18s; display: flex; flex-direction: column; overflow: hidden; }
.sheet.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.sheet-hd { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.sheet-hd b { font-family: var(--f-display); font-size: 18px; }
.sheet-hd .grab { display: none; }
.sheet-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; display: grid; gap: 8px; }
.sheet-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; cursor: pointer; color: var(--ink); font: inherit; transition: transform .12s, background .18s; }
.sheet-item:active { transform: scale(.98); }
.sheet-item:hover { background: var(--surface); }
.sheet-item .si-ic { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.sheet-item .si-ic svg { width: 20px; height: 20px; }
.sheet-item .si-tx { flex: 1; min-width: 0; }
.sheet-item .si-tx b { display: block; font-size: 15px; }
.sheet-item .si-tx small { color: var(--muted); font-size: 12.5px; display: block; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-item .si-ar { flex: 0 0 auto; color: var(--muted); font-size: 15px; }
.card.flash { animation: cardFlash 1.6s ease; }
@keyframes cardFlash { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 20%, 60% { box-shadow: 0 0 0 3px var(--accent); } }

/* ---------- تسجيل الفيديو ---------- */
.rec-wrap { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 9/16; max-height: 46vh; margin: 0 auto; }
.rec-prev { width: 100%; height: 100%; object-fit: cover; display: block; }
.rec-timer { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.6); color: #fff; font: 600 13px/1 var(--f-body); padding: 5px 10px; border-radius: 999px; display: none; }
.rec-timer.on { display: block; }
.rec-timer.live::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f44; margin-inline-end: 6px; vertical-align: middle; animation: recPulse 1s infinite; }
@keyframes recPulse { 50% { opacity: .3; } }
.rec-bar { display: flex; gap: 10px; justify-content: center; padding: 12px 16px 4px; }
.ex-vid { display: inline-flex; align-items: center; gap: 6px; }
.ex-vid a { display: inline-flex; align-items: center; gap: 4px; }
.vidchip { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; text-decoration: none; }
.vidchip.mine { background: var(--ok-soft); color: var(--ok); }
.recbtn { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--bad); cursor: pointer; display: grid; place-items: center; font-size: 17px; }
.recbtn:active { transform: scale(.94); }
.vids-strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.vids-strip video { width: 140px; border-radius: 10px; background: #000; }

/* ---------- عرض فيديو التمرين داخل التطبيق ---------- */
.ytbox { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; margin-top: 8px; }
.ytbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.ytbtn { display: inline-flex; align-items: center; gap: 6px; }
.ytwrap { margin-top: 8px; }
.linkbtn { background: none; border: 0; padding: 0; margin: 0; color: var(--accent); font: inherit; font-size: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.yt-inline { margin: 10px 0 4px; }

/* ---------- نظرة عامة (أقل تفاصيل) + نافذة القسم ---------- */
.ov .card.ovcard { cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .1s; }
.ov .card.ovcard:hover { border-color: var(--accent); }
.ov .card.ovcard:active { transform: scale(.997); }
.ov .card.ovcard > .ovhide { display: none !important; }
.ov .card.ovcard > .ovsub { margin: 0 0 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ovchev { display: none; margin-inline-start: auto; color: var(--muted); font-size: 19px; font-weight: 400; }
.ov .ovchev { display: inline-block; }
.secdlg { width: min(760px, 96vw); }
.secdlg .dh.sec-hd { display: flex; justify-content: flex-end; padding: 8px 10px 0; }
.secdlg .db { padding: 6px 8px 14px; max-height: 78vh; }
.recdlg { width: min(430px, 95vw); }
.recdlg .dh { display: flex; align-items: center; gap: 8px; }
.sub { color: var(--ink-2); } .muted { color: var(--muted); font-size: 13.5px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ai { background: var(--path-soft); color: var(--path); border-color: transparent; }
.btn.sm { min-height: 34px; padding: 4px 11px; font-size: 14px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.note { border-radius: 12px; padding: 10px 14px; font-size: 14.5px; background: var(--accent-soft); }
.note.warn { background: var(--warn-soft); } .note.bad { background: var(--bad-soft); } .note.path { background: var(--path-soft); }
label.f { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; }
input[type=number], input[type=text], input[type=password], input[type=date], input[type=url], select, textarea { width: 100%; min-height: 42px; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); margin-top: 4px; }
input[type=number] { direction: ltr; text-align: right; }
textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
.t-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th, .t td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.t th { background: var(--surface-2); font-size: 12px; color: var(--ink-2); position: sticky; top: 0; }
.t td.l, .t th.l { text-align: start; }
.t tr:last-child td { border-bottom: 0; }
.c-done { color: var(--ok); font-weight: 700; } .c-skip { color: var(--bad); font-weight: 700; } .c-na { color: var(--muted); }

/* ---------- الشاشة ---------- */
.journey { padding: 14px 16px 6px; overflow: hidden; }
.journey svg { width: 100%; height: auto; display: block; direction: ltr; }
.journey .lbl { font-family: var(--f-body); font-size: 11px; fill: var(--ink-2); }
.journey .lbl.b { font-weight: 700; fill: var(--ink); font-size: 12px; }
.pulse { animation: pulse 2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pulse { 0%,100% { opacity: .9; transform: scale(1); } 50% { opacity: .25; transform: scale(1.9); } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
.kpi .l { font-size: 13px; color: var(--ink-2); }
.kpi .v { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.kpi .v small { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 400; }
.kpi .d { font-size: 12.5px; color: var(--muted); }
.meter { height: 7px; border-radius: 9px; background: var(--accent-soft); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 9px; }
.gauge { display: flex; flex-direction: column; align-items: center; }
.gauge svg { width: 100%; max-width: 260px; height: auto; direction: ltr; }

/* ---------- السجل ---------- */
.ex-row { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ex-row:last-child { border-bottom: 0; }
.chk { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; font-size: 20px; font-weight: 700; color: transparent; }
.chk[data-s="done"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.chk[data-s="skip"] { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.ex-n { font-weight: 600; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.ex-m { font-size: 12.5px; color: var(--ink-2); }
.scale { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; margin-top: 4px; }
.scale button { min-height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; font-weight: 600; padding: 0; font-variant-numeric: tabular-nums; }
.scale button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.datebar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.datebar input { width: auto; margin: 0; }

/* ---------- الجدول ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal .dh { font-size: 11.5px; color: var(--muted); text-align: center; }
.cal .c { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; position: relative; overflow: hidden; }
.cal .c .fill { position: absolute; inset: auto 0 0 0; background: var(--accent); opacity: .85; }
.cal .c span { position: relative; z-index: 1; font-weight: 600; }
.cal .c.full span { color: var(--accent-ink); }
.cal .c i { position: relative; z-index: 1; width: 7px; height: 7px; border-radius: 50%; margin-top: 2px; }
.cal .c.empty { visibility: hidden; }
.cal .c.today { outline: 2px solid var(--ink); }
.cal .c.out { opacity: .35; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }

/* ---------- الخطة ---------- */
.lv { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.lv:last-child { border-bottom: 0; }
.lv .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-family: var(--f-display); border: 2px solid var(--line); color: var(--muted); }
.lv.done .n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.lv.now .n { border-color: var(--path); color: var(--path); box-shadow: 0 0 0 4px var(--path-soft); }
.exc { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.exc ol { margin: 6px 0 0; padding-inline-start: 20px; font-size: 14px; }
.exc .dose { display: inline-block; background: var(--surface-2); border-radius: 8px; padding: 2px 9px; font-size: 13px; }

/* ---------- الإصابة ---------- */
.knee { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .knee { grid-template-columns: 1fr; } }
.knee svg { width: 100%; height: auto; display: block; direction: ltr; max-height: 560px; }
.layer-toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.layer-toggles button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.layer-toggles button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.layer-toggles i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.stage-slider { width: 100%; accent-color: var(--path); }
.stages { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); gap: 4px; }
.stages span { flex: 1; text-align: center; cursor: pointer; }
.stages span.on { color: var(--path); font-weight: 700; }
.what { display: grid; gap: 8px; }
.what div { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.what b { display: block; font-size: 12.5px; color: var(--muted); }
.refs li { direction: ltr; text-align: left; font-size: 13px; margin-bottom: 6px; color: var(--ink-2); }

// يحفظ رابط الفيديو على تمرين في يوم معيّن
function ytID(url) {
  if (!url) return null;
  const m = String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if (m) return m[1];
  const v = String(url).match(/[?&]v=([A-Za-z0-9_-]{6,})/);
  return v ? v[1] : null;
}
// يبني مشغّلاً مضمّناً داخل التطبيق لفيديو يوتيوب (بدون فتح يوتيوب)
function ytEmbed(url) {
  const id = ytID(url);
  if (!id) return '';
  return `<div class="ytbox"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1" title="فيديو التمرين" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`;
}

}

    ${s.ph ? `<div class="tiles">${[['التمارين', s.rest ? 'راحة' : `${s.done}/${s.planned}`], ['الخطوات', fmt(s.log?.steps)], ['ألم التمارين', s.painMax ?? '—', painCol(s.painMax, s.limit)], ['ألم الصبح', s.painMorning ?? '—', painCol(s.painMorning, s.limit)]].map(([l, v, c]) => `<div class="tile"><span>${l}</span><b style="${c ? 'color:' + c : ''}">${v}</b></div>`).join('')}</div>
    ${!s.rest ? `<div class="exdots">${phaseExFor(s.ph, d).map(e => { const v = s.log?.ex?.[e.id]; return `<span class="xd ${v?.d === true ? 'y' : v?.d === false ? 'n' : ''}" title="${esc(e.name)}">${esc(e.short || e.name.slice(0, 3))}</span>`; }).join('')}</div>` : ''}` : '<p class="muted">قبل بداية العلاج.</p>'}

const parseDose = d => { const m = String(d || '').match(/^\s*(\d+)\s*[x×X*]\s*(\d+)\s*(ث|ثانية|ثواني|s|sec)?\s*$/); return m ? { sets: +m[1], mode: m[3] ? 'hold' : 'reps', val: +m[2] } : null; };

        : '<p class="sub" style="margin:0">فعّل المزامنة أولاً، وبعدها يطلع هنا الرابط.</p>'}</section>
      <section class="card"><h2>نقل البيانات</h2>
        <p class="sub" style="margin-top:0">بيانات نسخة رُكبة القديمة على هذا الجهاز انقلت تلقائياً. ولو عندك ملف تصدير من جهاز ثاني، استورده. الدمج ياخذ الأحدث لكل يوم.</p>
        <div class="row"><label class="btn" for="imp">استيراد ملف</label><input type="file" id="imp" accept=".json,application/json" hidden>${CAP.downloads ? '<button class="btn" id="exp">تصدير نسخة</button>' : ''}${!gh ? `<button class="btn primary" id="saveNow" ${dirty ? '' : 'disabled'}>حفظ الآن</button>` : ''}</div></section>
    </div>`;
  },
  bind(root) {
    // عند فتح القسم كنافذة، تُنقل البطاقة خارج root — فلازم ندوّر الحقول بالنسبة للبطاقة نفسها
    const fld = (el, sel) => (el.closest('.card') || root).querySelector(sel) || document.querySelector(sel);
    $$('[data-pk]', root).forEach(i => i.onchange = () => { D.profile[i.dataset.pk] = i.type === 'number' ? num(i.value) : i.value; markDirty('cfg'); toast('حُفظ'); });
    const sn = $('#saveNow', root); if (sn) sn.onclick = () => { manualSave = true; clearTimeout(saveTimer); if (MODE === 'claude') dirty = true; saveCloud(true); };
    const go = $('#gOff', root); if (go) go.onclick = () => { Sync.setSecrets({ ...Sync.secrets(), on: false }); saveState(); render(); };
    const gc = $('#gCopy', root); if (gc) gc.onclick = async () => { const i = fld(gc, '#gIdShow'); try { await navigator.clipboard.writeText(i.value); toast('انسخ ✓'); } catch { i.select(); } };
    const gon = $('#gOn', root); if (gon) gon.onclick = async () => {
      const token = fld(gon, '#gTok').value.trim(); let gistId = normGistId(fld(gon, '#gId').value);
      if (!token) { toast('الصق التوكن'); return; }
      const old = gon.textContent; gon.disabled = true; gon.textContent = 'جاري التحقق…';
      try {
        const p = await probeTok(token);
        if (p.ok && p.scopes != null && !/gist/.test(p.scopes)) { toast('هذا التوكن بلا صلاحية «gist». أنشئ توكن فيه صلاحية gist.'); return; }
        if (!p.ok && p.hard) { toast(p.msg); return; }
        const upd = { ...Sync.secrets(), token, gistId: gistId || Sync.secrets().gistId, on: true };
        // نفس التوكن يخدم الفيديو إذا عنده صلاحية repo
        if (!p.ok || p.scopes == null || /repo/.test(p.scopes)) { upd.ghToken = token; upd.ghOwner = undefined; upd.ghRepo = undefined; }
        Sync.setSecrets(upd); manualSave = true; await saveCloud(true);
      } catch (e) { toast('فشل: ' + String(e.message || e)); }
      finally { gon.disabled = false; gon.textContent = old; }
      render(); };
    const as = $('#aSave', root); if (as) as.onclick = async () => {
      const k = fld(as, '#aKey').value.trim(); if (!k) { toast('الصق المفتاح'); return; }
      Sync.setSecrets({ ...Sync.secrets(), apiKey: k }); as.disabled = true; as.textContent = 'جاري التجربة…';
      try { await AI.text('رد بكلمة "تمام" فقط.'); toast('Claude مفعّل'); render(); } catch (e) { toast(AI.err(e)); as.disabled = false; as.textContent = 'حفظ وتجربة'; } };
    const ao = $('#aOff', root); if (ao) ao.onclick = () => { const s = Sync.secrets(); delete s.apiKey; Sync.setSecrets(s); render(); };
    const cp = $('#cpLink', root); if (cp) cp.onclick = async () => { const i = fld(cp, '#docLink'); try { await navigator.clipboard.writeText(i.value); toast('انسخ'); } catch { i.select(); } };
    const vs = $('#vSave', root); if (vs) vs.onclick = async () => {
      const t = fld(vs, '#vTok').value.trim();
      if (!t) { toast('الصق التوكن'); return; }
      const o = vs.textContent; vs.disabled = true; vs.textContent = 'جاري التحقق…';
      try {
        const p = await probeTok(t);
        if (p.ok && p.scopes != null && !/repo/.test(p.scopes)) { toast('هذا التوكن بلا صلاحية «repo» — الفيديو يحتاجها.'); return; }
        if (!p.ok && p.hard) { toast(p.msg); return; }
        Sync.setSecrets({ ...Sync.secrets(), ghToken: t, ghOwner: undefined, ghRepo: undefined }); toast('حُفظ إعداد الفيديو ✓');
      } catch (e) { toast('فشل: ' + String(e.message || e)); }
      finally { vs.disabled = false; vs.textContent = o; }
      render();
    };
    const vr = $('#vReset', root); if (vr) vr.onclick = () => { const s = Sync.secrets(); delete s.ghToken; delete s.ghOwner; delete s.ghRepo; delete s.cloud; delete s.preset; Sync.setSecrets(s); render(); };
    const ex = $('#exp', root); if (ex) ex.onclick = async () => { try { await CAP.downloads.save({ filename: `rukba-data-${today()}.json`, data: JSON.stringify(D, null, 1) }); } catch {} };
    $('#imp', root).onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => {
      try { const n = importData(JSON.parse(rd.result)); markDirty('cfg'); toast(`تم دمج ${n} يوم`); render(); }
      catch { toast('الملف مو نسخة رُكبة صالحة'); } }; rd.readAsText(f); e.target.value = ''; };
  }
};

boot();
/* إجباري: ألغِ تسجيل كل Service Workers قديمة قبل تسجيل الجديد */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister().catch(() => {}));
  }).catch(() => {});
  addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=2.5.0').catch(() => {}));
}
</script>

</body>
</html>
